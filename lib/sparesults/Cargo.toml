[package]
name = "pometry-sparesults"
version = "0.3.5"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["SPARQL"]
repository = "https://github.com/Pometry/oxigraph"
homepage = "https://github.com/Pometry/oxigraph"
description = "Pometry's fork of oxigraph's sparesults: SPARQL query results formats parsers and serializers"
documentation = "https://docs.rs/pometry-sparesults"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sparesults"

[features]
default = []
sparql-12 = ["oxrdf/rdf-12"]
async-tokio = [
  "dep:tokio",
  "quick-xml/async-tokio",
  "json-event-parser/async-tokio",
]

[dependencies]
json-event-parser.workspace = true
memchr.workspace = true
oxrdf.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
