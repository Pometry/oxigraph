[package]
name = "pometry-oxrdfxml"
version = "0.2.5"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["RDFXML", "XML", "RDF"]
repository = "https://github.com/Pometry/oxigraph"
homepage = "https://github.com/Pometry/oxigraph"
description = "Pometry's fork of oxigraph's oxrdfxml: Parser and serializer for the RDF/XML format"
documentation = "https://docs.rs/pometry-oxrdfxml"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "oxrdfxml"

[features]
default = []
rdf-12 = ["oxrdf/rdf-12"]
async-tokio = ["dep:tokio", "quick-xml/async-tokio"]

[dependencies]
oxilangtag.workspace = true
oxiri.workspace = true
oxrdf.workspace = true
quick-xml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
