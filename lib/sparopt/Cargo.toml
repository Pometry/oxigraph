[package]
name = "pometry-sparopt"
version = "0.3.9"
authors.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["SPARQL"]
repository = "https://github.com/Pometry/oxigraph"
homepage = "https://github.com/Pometry/oxigraph"
documentation = "https://docs.rs/pometry-sparopt"
description = "Pometry's fork of oxigraph's sparopt: SPARQL optimizer"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sparopt"

[features]
default = []
sparql-12 = ["spargebra/sparql-12"]
sep-0002 = ["spargebra/sep-0002"]
sep-0006 = ["spargebra/sep-0006"]

[dependencies]
oxrdf.workspace = true
rand.workspace = true
spargebra.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
